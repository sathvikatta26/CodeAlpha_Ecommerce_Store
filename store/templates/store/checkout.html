<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ShopEase</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
            padding: 30px 15px;
        }

        .container {
            max-width: 950px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #243b67;
        }

        .header a,
        .back-link {
            color: #243b67;
            text-decoration: none;
            font-weight: bold;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        h2 {
            margin-bottom: 20px;
            color: #243b67;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .place-order-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #243b67;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .place-order-btn:hover {
            background: #17294a;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 18px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .item-name {
            font-weight: bold;
        }

        .item-details {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 19px;
            font-weight: bold;
            color: #243b67;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
        }

        @media (max-width: 700px) {
            .checkout-layout {
                grid-template-columns: 1fr;
            }

            .header {
                align-items: flex-start;
                gap: 10px;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="header">
            <h1>ShopEase Checkout</h1>
            <a href="{% url 'cart' %}">← Back to Cart</a>
        </div>

        <div class="checkout-layout">

            <!-- Delivery Details -->
            <div class="card">
                <h2>Delivery Details</h2>

                {% if error %}
                    <div class="error">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="form-group">
                        <label for="full_name">Full Name</label>
                        <input
                            type="text"
                            id="full_name"
                            name="full_name"
                            value="{{ full_name }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            value="{{ email }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            value="{{ phone }}"
                            maxlength="15"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="address">Delivery Address</label>
                        <textarea
                            id="address"
                            name="address"
                            required
                        >{{ address }}</textarea>
                    </div>

                    <button type="submit" class="place-order-btn">
                        Place Order
                    </button>
                </form>
            </div>

            <!-- Order Summary -->
            <div class="card">
                <h2>Order Summary</h2>

                {% for item in cart_items %}
                    <div class="item">
                        <div>
                            <div class="item-name">
                                {{ item.product.name }}
                            </div>

                            <div class="item-details">
                                ₹{{ item.product.price }} × {{ item.quantity }}
                            </div>
                        </div>

                        <strong>₹{{ item.subtotal }}</strong>
                    </div>
                {% endfor %}

                <div class="total">
                    <span>Total</span>
                    <span>₹{{ total }}</span>
                </div>

                <a href="{% url 'cart' %}" class="back-link">
                    Edit Cart
                </a>
            </div>

        </div>
    </div>
</body>
</html>
